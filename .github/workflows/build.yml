name: Build

on:
  release:
    types: [published]
  push:
    branches: ["**"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/management/web/**"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/management/web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NIGHTLY_BUILD: ${{ github.event_name == 'push' && github.ref_type == 'branch' && contains(vars.NIGHTLY_RELEASE_ENABLED_BRANCHES, github.ref_name) }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v1.4.0 or v1.4.0-rc.1"
            exit 1
          fi

      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
          cache: true

      - name: Get project dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  build:
    needs: test
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEGIN Linux ARM 5 6 7
          - { goos: linux, goarch: arm, goarm: 7 }
          - { goos: linux, goarch: arm, goarm: 6 }
          - { goos: linux, goarch: arm, goarm: 5 }
          # END Linux ARM 5 6 7
          # BEGIN Other architectures
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: windows, goarch: arm64 }
          # BEGIN MIPS
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: mips64le }
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips }
          # END MIPS
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$GOOS-$GOARCH$GOARM
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Get project dependencies
        run: go mod download

      - name: Build
        run: |
          mkdir -p build_assets
          VERSION=dev
          COMMIT_ID=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION=$GITHUB_REF_NAME
            COMMIT_ID=
          fi
          go build -v -o build_assets/zju-connect -trimpath \
            -ldflags "-s -w -buildid= -X main.zjuConnectVersion=$VERSION -X main.CommitID=$COMMIT_ID" .

      - name: Rename Windows zju-connect
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv zju-connect zju-connect.exe

      - name: Upload build artifact
        if: github.ref_type != 'tag' && env.NIGHTLY_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zju-connect-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: build_assets/*
          if-no-files-found: error

      - name: Prepare release files
        if: github.ref_type == 'tag' || env.NIGHTLY_BUILD == 'true'
        run: |
          mkdir release_assets
          zip -9 -j "release_assets/zju-connect-$ASSET_NAME.zip" build_assets/*
          if [[ "$ASSET_NAME" == linux-amd64 ]]; then
            cp build_assets/zju-connect release_assets/xmut-connect-linux-amd64
          fi

      - name: Upload release artifact
        if: github.ref_type == 'tag' || env.NIGHTLY_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: release_assets/*
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref_type == 'branch' && contains(vars.NIGHTLY_RELEASE_ENABLED_BRANCHES, github.ref_name))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
      cancel-in-progress: false
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release_assets
        run: |
          sha256sum -- *.zip xmut-connect-linux-amd64 > SHA256SUMS
          assets=( *.zip xmut-connect-linux-amd64 SHA256SUMS )

          if [[ "$NIGHTLY_BUILD" == true ]]; then
            gh release upload nightly "${assets[@]}" --clobber
            exit 0
          fi

          tag=$GITHUB_REF_NAME
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            gh release upload "$tag" "${assets[@]}" --clobber
            exit 0
          fi

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false --verify-tag
            else
              echo "Release $tag is already published."
            fi
          else
            prerelease=()
            if [[ "$tag" == *-* ]]; then
              prerelease+=(--prerelease)
            fi
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' \
              "refs/tags/$tag" > release-notes.md
            gh release create "$tag" "${assets[@]}" "${prerelease[@]}" \
              --verify-tag --title "xmut-connect $tag" --notes-file release-notes.md
          fi

  update-aur:
    if: github.event_name == 'release' && github.repository == 'Mythologyli/zju-connect'
    needs: publish-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Update AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi

          TAG="${{ github.event.release.tag_name }}"
          PKGVER="${TAG#v}"
          PKGVER="${PKGVER//-/_}"

          eval "$(ssh-agent -s)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          git clone ssh://aur@aur.archlinux.org/zju-connect-bin.git aur-package
          cd aur-package

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          OLD_PKGVER="$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2-)"
          OLD_PKGREL="$(grep -E '^pkgrel=' PKGBUILD | cut -d= -f2-)"
          if [ "${OLD_PKGVER}" = "${PKGVER}" ]; then
            PKGREL="$((OLD_PKGREL + 1))"
          else
            PKGREL=1
          fi

          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD

          docker run --rm -i -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash <<'EOF'
          set -euo pipefail
          pkg_owner="$(stat -c '%u:%g' /pkg)"
          trap 'chown -R "$pkg_owner" /pkg' EXIT
          pacman -Sy --noconfirm pacman-contrib
          useradd -m builder
          chown -R builder:builder /pkg
          su builder -c 'cd /pkg && updpkgsums && makepkg --printsrcinfo > .SRCINFO'
          EOF

          git diff --check
          if git diff --quiet; then
            echo "AUR package is already up to date."
            exit 0
          fi

          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${TAG}"
          git push

  nightly:
    if: github.event_name == 'push' && github.ref_type == 'branch' && contains(vars.NIGHTLY_RELEASE_ENABLED_BRANCHES, github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Move nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push origin nightly --force
