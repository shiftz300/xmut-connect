[program:xmut-connect]
command=/usr/local/bin/xmut-connect -config /etc/xmut-connect/config.toml
directory=/etc/xmut-connect
user=xmut-connect
numprocs=1
umask=077
autostart=true
autorestart=unexpected
startsecs=3
startretries=3
exitcodes=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/xmut-connect.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
